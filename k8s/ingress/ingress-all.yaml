# ============================================================
#  NGINX Ingress Controller — Minikube / bare-metal
#
#  Step 1 — enable ingress addon in minikube:
#    minikube addons enable ingress
#
#  OR install manually on bare-metal:
#    kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml
#
#  Step 2 — apply this file:
#    kubectl apply -f k8s/ingress/ingress-all.yaml
#
#  Step 3 — add to /etc/hosts (or Windows C:\Windows\System32\drivers\etc\hosts):
#    192.168.56.20  dev.devsecops.local
#    192.168.56.20  staging.devsecops.local
#    192.168.56.20  devsecops.local
#
#  URL mapping:
#    dev.devsecops.local      → dev namespace     (branch: dev)
#    staging.devsecops.local  → staging namespace  (branch: staging)
#    devsecops.local          → prod namespace     (branch: main)
# ============================================================

# ──────────────────────────────────────────────────────────────
#  DEV Ingress  (dev.devsecops.local)
#  Routes all /api/* traffic to the API Gateway in infra ns,
#  which then forwards to services in dev namespace via Eureka.
#  The frontend is served from the frontend service in dev ns.
# ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsecops-dev
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # CORS for Angular dev server
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
spec:
  ingressClassName: nginx
  rules:
    - host: dev.devsecops.local
      http:
        paths:
          # Angular frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
          # All API traffic → Gateway (ClusterIP in infra, proxied via ExternalName)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-proxy
                port: { number: 8084 }

---
# ExternalName service: lets dev namespace reach the Gateway in infra namespace
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-proxy
  namespace: dev
spec:
  type: ExternalName
  externalName: api-gateway.infra.svc.cluster.local
  ports:
    - port: 8084

---
# ──────────────────────────────────────────────────────────────
#  STAGING Ingress  (staging.devsecops.local)
# ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsecops-staging
  namespace: staging
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://staging.devsecops.local"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
spec:
  ingressClassName: nginx
  rules:
    - host: staging.devsecops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-proxy
                port: { number: 8084 }

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-proxy
  namespace: staging
spec:
  type: ExternalName
  externalName: api-gateway.infra.svc.cluster.local
  ports:
    - port: 8084

---
# ──────────────────────────────────────────────────────────────
#  PROD Ingress  (devsecops.local)
# ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsecops-prod
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Rate-limiting on prod
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://devsecops.local"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
spec:
  ingressClassName: nginx
  rules:
    - host: devsecops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-proxy
                port: { number: 8084 }

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-proxy
  namespace: prod
spec:
  type: ExternalName
  externalName: api-gateway.infra.svc.cluster.local
  ports:
    - port: 8084

---
# ──────────────────────────────────────────────────────────────
#  Frontend Deployment + Service (shared template, deployed
#  per namespace by the Jenkinsfile with correct image tag)
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, env: prod }
    spec:
      containers:
        - name: frontend
          image: 192.168.56.10:5000/frontend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 80 }]
          resources:
            requests: { memory: "64Mi",  cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "100m" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: prod
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-proxy
  namespace: dev
spec:
  type: ExternalName
  externalName: prometheus.monitoring.svc.cluster.local
  ports:
    - port: 9090
