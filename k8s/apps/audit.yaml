# =========================
# AUDIT LOG SERVICE
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-log-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-log-service
  template:
    metadata:
      labels:
        app: audit-log-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: audit-log-service
          image: 192.168.56.10:5000/audit-log-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085

          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.infra.svc.cluster.local:3306/auditlogdb?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: db-secret, key: DB_USERNAME }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: jwt-secret, key: JWT_SECRET }

            # Eureka — same pattern as all other services (IP-based, no hostname override)
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server.infra.svc.cluster.local:8761/eureka/
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_NONSECUREPORT
              value: "8085"

            # JVM tuning
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError"

            # Actuator — expose all needed endpoints
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_READINESSSTATE_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED
              value: "true"
            - name: MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_TAGS_APPLICATION
              value: "audit-log-service"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: audit-log-service
  namespace: apps
  labels:
    app: audit-log-service
spec:
  type: ClusterIP
  selector:
    app: audit-log-service
  ports:
    - port: 8085
      targetPort: 8085
