apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8087"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: notification-service
          image: 192.168.56.10:5000/notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.infra.svc.cluster.local:3306/notificationdb?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: db-secret, key: DB_USERNAME }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: DB_PASSWORD }

            # Eureka — IP based like all other services (no hostname override)
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server.infra.svc.cluster.local:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_NONSECUREPORT
              value: "8087"

            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef: { name: mail-secret, key: MAIL_USERNAME }
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef: { name: mail-secret, key: MAIL_PASSWORD }

            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx768m -XX:+ExitOnOutOfMemoryError"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_READINESSSTATE_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED
              value: "true"
            - name: MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_TAGS_APPLICATION
              value: "notification-service"

          startupProbe:
            httpGet: { path: /actuator/health, port: 8087 }
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8087 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10

          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8087 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10

          resources:
            requests: { memory: "512Mi", cpu: "100m" }
            limits:   { memory: "1Gi",   cpu: "500m" }

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: apps
  labels:
    app: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - port: 8087
      targetPort: 8087
