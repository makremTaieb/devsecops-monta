# ============================================================
#  PROD overlay — namespace: prod   (branch: main)
#  • pinned image tags set by Jenkinsfile (e.g. :1.4.2)
#  • 3 replicas per service (HA)
#  • WARN log level (minimal noise)
#  • highest resource limits
#  • RollingUpdate with maxUnavailable: 0 (zero-downtime)
# ============================================================

# ── Auth Service ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: prod
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service, env: prod }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: auth-service
          image: 192.168.56.10:5000/auth-service:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8081 }]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.infra.svc.cluster.local:3306/authdb?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: db-secret, key: DB_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secret, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: JWT_SECRET } }
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server.infra.svc.cluster.local:8761/eureka/
            - name: LOGGING_LEVEL_ROOT
              value: "WARN"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits:   { memory: "512Mi", cpu: "400m" }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 150
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: prod
spec:
  type: ClusterIP
  selector: { app: auth-service }
  ports: [{ port: 8081, targetPort: 8081 }]

