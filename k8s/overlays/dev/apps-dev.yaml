# ============================================================
#  DEV overlay — namespace: dev
#  • latest image tags (fast iteration)
#  • minimal replicas (1)
#  • reduced resource limits (saves RAM on minikube)
#  • DEBUG log level
# ============================================================

# ── Auth Service ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service, env: dev }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: auth-service
          image: 192.168.56.10:5000/auth-service:dev
          imagePullPolicy: Always
          ports: [{ containerPort: 8081 }]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.infra.svc.cluster.local:3306/authdb_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: db-secret, key: DB_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secret, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: JWT_SECRET } }
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server.infra.svc.cluster.local:8761/eureka/
            - name: LOGGING_LEVEL_ROOT
              value: "DEBUG"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx256m"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits:   { memory: "512Mi", cpu: "200m" }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            failureThreshold: 30
            periodSeconds: 10
            initialDelaySeconds: 40
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 90
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 120
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: dev
spec:
  type: ClusterIP
  selector: { app: auth-service }
  ports: [{ port: 8081, targetPort: 8081 }]

