# ============================================================
#  STAGING overlay — namespace: staging
#  • versioned image tags  (e.g. :1.2.3)  set by Jenkinsfile
#  • 2 replicas per service (availability testing)
#  • INFO log level
#  • same infra as dev (shared MySQL / Eureka / Gateway)
# ============================================================

# ── Auth Service ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service, env: staging }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: auth-service
          image: 192.168.56.10:5000/auth-service:staging
          imagePullPolicy: Always
          ports: [{ containerPort: 8081 }]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "staging"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.infra.svc.cluster.local:3306/authdb_staging?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: db-secret, key: DB_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secret, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: JWT_SECRET } }
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server.infra.svc.cluster.local:8761/eureka/
            - name: LOGGING_LEVEL_ROOT
              value: "INFO"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
          resources:
            requests: { memory: "192Mi", cpu: "150m" }
            limits:   { memory: "384Mi", cpu: "300m" }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 150
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: staging
spec:
  type: ClusterIP
  selector: { app: auth-service }
  ports: [{ port: 8081, targetPort: 8081 }]

