  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, env: staging }
    spec:
      containers:
        - name: frontend
          image: 192.168.56.10:5000/frontend:staging
          imagePullPolicy: Always
          ports: [{ containerPort: 80 }]
          resources:
            requests: { memory: "64Mi",  cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "100m" }
