apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: 192.168.56.10:5000/eureka-server:latest
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_APPLICATION_NAME
              value: "eureka-server"

            # IMPORTANT for Kubernetes networking
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "eureka-server"

            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"

            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"

            # IMPORTANT: avoid localhost confusion
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server.infra.svc.cluster.local:8761/eureka/"

          readinessProbe:
            httpGet:
              path: /
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: infra
spec:
  type: NodePort
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
      nodePort: 30061