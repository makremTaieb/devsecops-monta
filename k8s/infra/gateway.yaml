apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: api-gateway
          image: 192.168.56.10:5000/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: EUREKA_URL
              value: http://eureka-server.infra.svc.cluster.local:8761/eureka/
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "*"
            - name: MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: always
          startupProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "512Mi", cpu: "250m" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: infra
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30080
