# ─────────────────────────────────────────────────────────────────
# Example SMTP Secret for Notification-Service.
# Replace the values locally or create the secret from environment variables.
#
# To update credentials:
#   kubectl create secret generic mail-secret \
#     --from-literal=MAIL_USERNAME=your@gmail.com \
#     --from-literal=MAIL_PASSWORD="your-app-password" \
#     -n apps --dry-run=client -o yaml | kubectl apply -f -
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: mail-secret
  namespace: apps
type: Opaque
stringData:
  MAIL_USERNAME: disabled@localhost
  MAIL_PASSWORD: change-me-before-deployment
